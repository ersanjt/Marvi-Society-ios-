name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-contract:
    name: Validate docs & API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/OPERATIONS.md
          test -f packages/api-contract/openapi.yaml
          test -f release/manifest.json
          echo "Documentation structure OK"

      - name: Validate OpenAPI (optional)
        continue-on-error: true
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx --yes @redocly/cli lint packages/api-contract/openapi.yaml
          else
            echo "Skipping OpenAPI lint — npx not required for Phase 0"
          fi

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    needs: docs-and-contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run web:build

  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    needs: docs-and-contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        working-directory: apps/android
        run: |
          test -f local.properties.example
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:assembleDebug --no-daemon

  ios-build:
    name: iOS build
    runs-on: macos-latest
    needs: docs-and-contract
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project apps/ios/MarviSociety.xcodeproj \
            -scheme MarviSociety \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO
